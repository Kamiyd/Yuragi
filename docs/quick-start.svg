  <text class="eyebrow" x="54.00" y="62">01 / SKELETON</text>
  <text class="heading" x="54.00" y="94">画出字形骨架</text>
  <text class="caption" x="54.00" y="121">每一笔是一条中心线，端点可以拖动</text>
  <rect class="card" x="414.67" y="24" width="370.67" height="352" rx="18"/>
  <text class="eyebrow" x="444.67" y="62">02 / VARIATION</text>
  <text class="heading" x="444.67" y="94">同一骨架，写法不同</text>
  <text class="caption" x="444.67" y="121">换个种子重写一遍，种子不变就能复现</text>
  <rect class="card" x="805.33" y="24" width="370.67" height="352" rx="18"/>
  <text class="eyebrow" x="835.33" y="62">03 / EXPORT</text>
