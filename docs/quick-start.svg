<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
  <title id="title">Yuragi 快速上手：画骨架、生成变体、导出 SVG</title>
  <desc id="desc">用“山”的手绘骨架生成三个不同版本，再导出为 SVG 文件。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .card { fill: #fff; stroke: #e4e4df; stroke-width: 1.2; }
      .eyebrow { fill: #73736d; font-size: 12px; font-weight: 650; letter-spacing: 1.4px; }
      .heading { fill: #20201d; font-size: 22px; font-weight: 650; }
      .caption { fill: #66665f; font-size: 14px; }
      .ink { fill: none; stroke: #24241f; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
      .skeleton { fill: none; stroke: #363630; stroke-width: 2.7; stroke-linecap: round; stroke-linejoin: round; }
      .secondary { fill: none; stroke: #76766f; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .grid { stroke: #ecece7; stroke-width: .7; }
      .fade-a, .fade-b, .fade-c, .fade-d, .variant-a, .variant-b, .variant-c, .export-card { opacity: 1; }
      @media (prefers-reduced-motion: no-preference) {
        .fade-a, .fade-b, .fade-c, .fade-d, .variant-a, .variant-b, .variant-c, .export-card { opacity: 0; animation-duration: 10s; animation-timing-function: cubic-bezier(.23,1,.32,1); animation-iteration-count: infinite; }
        .fade-a { animation-name: strokeA; }
        .fade-b { animation-name: strokeB; }
        .fade-c { animation-name: strokeC; }
        .fade-d { animation-name: strokeD; }
        .variant-a { animation-name: variantA; }
        .variant-b { animation-name: variantB; }
        .variant-c { animation-name: variantC; }
        .export-card { animation-name: exportIn; }
        @keyframes strokeA { 0%, 2% { opacity: 0; } 6%, 72% { opacity: 1; } 86%, 100% { opacity: 0; } }
        @keyframes strokeB { 0%, 8% { opacity: 0; } 12%, 72% { opacity: 1; } 86%, 100% { opacity: 0; } }
        @keyframes strokeC { 0%, 14% { opacity: 0; } 18%, 72% { opacity: 1; } 86%, 100% { opacity: 0; } }
        @keyframes strokeD { 0%, 20% { opacity: 0; } 24%, 72% { opacity: 1; } 86%, 100% { opacity: 0; } }
        @keyframes variantA { 0%, 31% { opacity: 0; } 36%, 72% { opacity: 1; } 86%, 100% { opacity: 0; } }
        @keyframes variantB { 0%, 38% { opacity: 0; } 43%, 72% { opacity: 1; } 86%, 100% { opacity: 0; } }
        @keyframes variantC { 0%, 45% { opacity: 0; } 50%, 72% { opacity: 1; } 86%, 100% { opacity: 0; } }
        @keyframes exportIn { 0%, 57% { opacity: 0; } 63%, 72% { opacity: 1; } 86%, 100% { opacity: 0; } }
      }
    </style>
  </defs>
  <rect width="1120" height="360" rx="24" fill="#f5f5f1"/>
  <rect class="card" x="20" y="20" width="344" height="320" rx="18"/>
  <rect class="card" x="388" y="20" width="344" height="320" rx="18"/>
  <rect class="card" x="756" y="20" width="344" height="320" rx="18"/>

  <text class="eyebrow" x="46" y="58">01 / INPUT</text>
  <text class="heading" x="46" y="91">画出字形骨架</text>
  <text class="caption" x="46" y="119">一笔一笔描，空白工程从这里开始</text>
