       线不是手画歪的：骨架规规矩矩地放在 assets/cursor-brush.json，抖动由
       scripts/handdraw.py 那道滤镜统一加，和字库出自同一支笔。改形改那份几何再重跑：
       python3 scripts/handdraw.py json assets/cursor-brush.json
       填色和外廓各抖各的，颜色会差着零点几个像素压不准线 —— 那是要的，别去对齐。
